# Caelestia dynamic scheme - snapshot of the live "darkgreen" Material You
# scheme (~/.local/state/caelestia/scheme.json). Regenerate this file if
# the wallpaper/scheme changes and you want kitty to follow.

foreground            #e0e3e4
background            #101415
selection_foreground  #101415
selection_background  #a0f9aa
cursor                #e0e3e4
cursor_text_color     #101415

url_color             #a0f9aa

# Normal colors (from scheme.json term0-7)
color0  #343434
color1  #23B65A
color2  #43ff88
color3  #7cfcab
color4  #78c19f
color5  #7ae9a7
color6  #80deb2
color7  #ccdcd6

# Bright colors (from scheme.json term8-15)
color8  #9aa59f
color9  #cdff9e
color10 #00f608
color11 #c9fff3
color12 #a4c7cd
color13 #a5f7a2
color14 #87f1b5
color15 #ffffff

# Tab bar
active_tab_foreground   #101415
active_tab_background   #24BD5C
inactive_tab_foreground #bec8cc
inactive_tab_background #212627

# Marks
mark1_foreground #101415
mark1_background #24BD5C
