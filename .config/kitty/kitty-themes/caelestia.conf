# Caelestia dynamic scheme - snapshot of the live monochrome Material You
# scheme (~/.local/state/caelestia/scheme.json), generated from the
# axalp-ch-f18.jpg wallpaper. Regenerate this file if the wallpaper/scheme
# changes and you want kitty to follow.

foreground            #e2e2e2
background            #131313
selection_foreground  #131313
selection_background  #f5f5f5
cursor                #e2e2e2
cursor_text_color     #131313

url_color             #f5f5f5

# Normal colors (from scheme.json term0-7)
color0  #adadad
color1  #c8c8c8
color2  #d8d8d8
color3  #dfdfdf
color4  #cfcfcf
color5  #cfcfcf
color6  #d7d7d7
color7  #dbdbdb

# Bright colors (from scheme.json term8-15)
color8  #d3d3d3
color9  #d5d5d5
color10 #e4e4e4
color11 #ebebeb
color12 #dcdcdc
color13 #dbdbdb
color14 #e3e3e3
color15 #ffffff

# Tab bar
active_tab_foreground   #1b1b1b
active_tab_background   #ffffff
inactive_tab_foreground #c6c6c6
inactive_tab_background #0e0e0e

# Marks
mark1_foreground #1b1b1b
mark1_background #ffffff
mark2_foreground #1b1b1b
mark2_background #e9e9e9
mark3_foreground #1b1b1b
mark3_background #f5f5f5
