# Caelestia dynamic scheme - snapshot of the live black+orange Material You
# scheme (~/.local/state/caelestia/scheme.json), generated from the
# axalp-ch-f18.jpg wallpaper. Regenerate this file if the wallpaper/scheme
# changes and you want kitty to follow.

foreground            #e2e2e2
background            #040404
selection_foreground  #040404
selection_background  #ffd87c
cursor                #e2e2e2
cursor_text_color     #040404

url_color             #ffd87c

# Normal colors (from scheme.json term0-7)
color0  #080808
color1  #ea6c00
color2  #ffbf7f
color3  #ffe0ca
color4  #b9ab66
color5  #ef936a
color6  #fabe70
color7  #edd4c2

# Bright colors (from scheme.json term8-15)
color8  #b39f92
color9  #ff893c
color10 #ffd6af
color11 #fff2e9
color12 #dabc92
color13 #feab85
color14 #ffd4a2
color15 #ffffff

# Tab bar
active_tab_foreground   #502500
active_tab_background   #ff9645
inactive_tab_foreground #c6c6c6
inactive_tab_background #070707

# Marks
mark1_foreground #502500
mark1_background #ff9645
mark2_foreground #502500
mark2_background #fd9d2d
mark3_foreground #502500
mark3_background #ffd87c
